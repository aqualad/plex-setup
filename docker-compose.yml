services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - VERSION=docker
      - PLEX_CLAIM=claim-.......
    volumes:
      - ${HOME}/docker/plex/config:/config
      - "/mnt/d/Media/TV Shows:/tv"
      - /mnt/d/Media/Movies:/movies
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${HOME}/docker/sonarr/config:/config
      - "/mnt/d/Media/TV Shows:/tv"
      - /mnt/d/Downloads:/downloads
    ports:
      - "8989:8989"
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${HOME}/docker/radarr/config:/config
      - /mnt/d/Media/Movies:/movies
      - /mnt/d/Downloads:/downloads
    ports:
      - "7878:7878"
    restart: unless-stopped
  qbittorrent:
    # image: lscr.io/linuxserver/qbittorrent:latest
    image: j4ym0/pia-qbittorrent:latest
    cap_add:
      - NET_ADMIN
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8082
      # - PIA_REGION=us_east
      - PIA_REGION=ca_toronto
      - PORT_FORWARDING=true
    volumes:
      - ${HOME}/docker/qbittorrent/config:/config
      - ${HOME}/docker/qbittorrent/config/auth.conf:/auth.conf
      - /mnt/d/Downloads:/downloads
    ports:
      - "8082:8082"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ${HOME}/docker/prowlarr/config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    environment:
      - PORT=11011
      - BASE_PATH=
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/New_York
    volumes:
      - ${HOME}/docker/cleanuparr/config:/config
      # Mount your downloads directory if needed
      - /mnt/d/Downloads:/downloads
    ports:
      - "11011:11011"
    restart: unless-stopped
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s        # Check every 30 seconds
      timeout: 10s         # Allow up to 10 seconds for response
      start_period: 30s    # Wait 30 seconds before first check
      retries: 3           # Mark unhealthy after 3 consecutive failures
  flaresolverr:
    # DockerHub mirror flaresolverr/flaresolverr:latest
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/New_York
    ports:
      - "${PORT:-8191}:8191"
    volumes:
      - /var/lib/flaresolver:/config
    restart: unless-stopped
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - NZBGET_USER=nzbget
      - NZBGET_PASS=tegbzn6789
    volumes:
      - ${HOME}/docker/nzbget/config:/config
      - /mnt/d/Downloads:/downloads
      - /mnt/d/Intermediate:/intermediate
    ports:
      - 6789:6789
    restart: unless-stopped
